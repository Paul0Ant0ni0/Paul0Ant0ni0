<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paulo Antonio - Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#06143f"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF176"/>
      <stop offset="0.5" stop-color="#FFE600"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D4FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbBlue">
      <stop offset="0" stop-color="#1F51FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1F51FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGold">
      <stop offset="0" stop-color="#FFE600" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFE600" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowGold" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b">
        <animate attributeName="stdDeviation" values="4;10;4" dur="3.5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlue" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00D4FF" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- orbs de luz -->
    <circle cx="160" cy="70" r="200" fill="url(#orbBlue)">
      <animate attributeName="cx" values="160;260;160" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="260" r="190" fill="url(#orbGold)">
      <animate attributeName="cx" values="850;760;850" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- feixe de luz varrendo -->
    <rect x="-300" y="0" width="300" height="320" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1300 0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- estrelas -->
    <g fill="#FFE600">
      <circle cx="90" cy="48" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="250" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="36" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="52" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="905" cy="70" r="1.9"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="190" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#00D4FF">
      <circle cx="60" cy="180" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="90" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="270" r="1.7"><animate attributeName="opacity" values="1;0.1;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="40" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="140" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="120" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- colchetes de código -->
    <text x="70" y="190" font-family="Courier New, monospace" font-size="110" font-weight="700" fill="#00D4FF" opacity="0.16" filter="url(#glowBlue)">&lt;</text>
    <text x="830" y="190" font-family="Courier New, monospace" font-size="110" font-weight="700" fill="#FFE600" opacity="0.16" filter="url(#glowBlue)">/&gt;</text>

    <!-- textos -->
    <text x="500" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="7" fill="url(#gold)" filter="url(#glowGold)">PAULO ANTONIO</text>
    <text x="500" y="202" text-anchor="middle" font-family="Courier New, monospace" font-size="24" letter-spacing="3" fill="#00D4FF" filter="url(#glowBlue)">&lt; Full Stack Developer /&gt;</text>
    <text x="500" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="4" fill="#9FB4FF">ANGULAR  ·  RUBY ON RAILS  ·  POSTGRESQL</text>

    <!-- ondas -->
    <path fill="#1F51FF" opacity="0.35" d="M0 286 q125 -26 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V320 H0Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path fill="#00D4FF" opacity="0.22" d="M0 296 q125 22 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V320 H0Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#FFE600" opacity="0.14" d="M0 304 q125 -16 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V320 H0Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- borda neon com luz correndo -->
  <rect x="2" y="2" width="996" height="316" rx="17" fill="none" stroke="#00D4FF" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="316" rx="17" fill="none" stroke="#FFE600" stroke-width="3" stroke-linecap="round" stroke-dasharray="180 2420" filter="url(#glowBlue)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2600" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
