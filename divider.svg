<svg width="1000" height="28" viewBox="0 0 1000 28" xmlns="http://www.w3.org/2000/svg" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F51FF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00D4FF"/>
      <stop offset="0.5" stop-color="#FFE600"/>
      <stop offset="0.7" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#1F51FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="13" width="1000" height="2" fill="url(#line)" filter="url(#g)"/>
  <circle cy="14" r="4" fill="#FFE600" filter="url(#g)">
    <animate attributeName="cx" values="0;1000" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <rect x="493" y="7" width="14" height="14" fill="#FFE600" transform="rotate(45 500 14)" filter="url(#g)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
